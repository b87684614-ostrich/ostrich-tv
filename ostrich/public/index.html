<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страус.TV — смотрите и делитесь видео</title>
  <meta name="description" content="Страус.TV — независимая видеоплатформа: загружайте свои видео, комментируйте и подписывайтесь на каналы. Регистрация только по логину и паролю, без e-mail и телефона.">
  <meta name="theme-color" content="#ff7a00">
  <meta property="og:title" content="Страус.TV">
  <meta property="og:description" content="Независимая видеоплатформа со страусиным характером.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <div id="impersonation-bar" class="imp-bar" hidden></div>

  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="menu-btn" aria-label="Меню" title="Меню"></button>
      <a href="#/" class="logo" aria-label="Страус.TV — главная">
        <img src="/img/logo.svg" alt="" width="34" height="24">
        <span class="logo-text">Страус<span class="logo-tv">.TV</span></span>
      </a>
    </div>
    <form class="search" id="search-form" role="search">
      <div class="search-box">
        <input type="search" id="search-input" placeholder="Введите запрос" autocomplete="off" aria-label="Поиск">
      </div>
      <button type="submit" class="search-btn" id="search-btn" aria-label="Поиск" title="Поиск"></button>
    </form>
    <div class="topbar-right" id="topbar-right"></div>
  </header>

  <div id="announcement" class="announcement" hidden></div>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Навигация"></nav>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <main id="content" class="content" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <noscript><p style="padding:40px;text-align:center">Для работы Страус.TV включите JavaScript.</p></noscript>
  <script src="/js/app.js"></script>
</body>
</html>
